
name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stecia-frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-deploy:
    runs-on: [self-hosted, linux, x64, stecia-frontend]
    timeout-minutes: 20

    env:
      IMAGE: stecia-frontend:${{ github.sha }}
      ROLLBACK_IMAGE: stecia-frontend:rollback
      COMPOSE_PROJECT: stecia-frontend
      SITE_PORT: ${{ vars.SITE_PORT || '5000' }}
      PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate configuration
        run: |
          if ! [[ "$SITE_PORT" =~ ^[0-9]+$ ]] ||
             [ "$SITE_PORT" -lt 1 ] ||
             [ "$SITE_PORT" -gt 65535 ]; then
            echo "::error::Invalid SITE_PORT."
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ] &&
             [ -z "$PUBLIC_HOST" ]; then
            echo "::error::Set PUBLIC_HOST in GitHub Actions Variables."
            exit 1
          fi

      - name: Build Docker image
        run: |
          docker build --pull -t "$IMAGE" .

      - name: Smoke test
        run: |
          set -Eeuo pipefail

          cid=$(docker run -d --rm "$IMAGE")

          cleanup() {
            docker stop "$cid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          echo "Waiting for Nginx..."

          for i in $(seq 1 30); do
            if docker exec "$cid" wget -qO- \
              http://127.0.0.1:80/ 2>/dev/null |
              grep -qi '<html'; then
              echo "Smoke test passed."
              exit 0
            fi
            sleep 1
          done

          echo "::error::Smoke test failed."
          docker logs "$cid" || true
          docker exec "$cid" nginx -T 2>&1 || true
          exit 1

      - name: Deploy production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -Eeuo pipefail

          export IMAGE

          docker compose -p "$COMPOSE_PROJECT" config --quiet

          CURRENT_CONTAINER=$(docker compose \
            -p "$COMPOSE_PROJECT" ps -q web)

          if [ -n "$CURRENT_CONTAINER" ]; then
            CURRENT_IMAGE=$(docker inspect \
              --format '{{.Image}}' "$CURRENT_CONTAINER")

            docker image tag "$CURRENT_IMAGE" "$ROLLBACK_IMAGE"
            echo "Previous production image preserved."
          fi

          if ! docker compose -p "$COMPOSE_PROJECT" \
            up -d --no-build --remove-orphans; then

            echo "::error::Deployment failed."

            if docker image inspect "$ROLLBACK_IMAGE" >/dev/null 2>&1; then
              IMAGE="$ROLLBACK_IMAGE" docker compose \
                -p "$COMPOSE_PROJECT" up -d --no-build
            fi

            exit 1
          fi

          URL="http://127.0.0.1:${SITE_PORT}/"
          HEALTHY=false

          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null \
              -w '%{http_code}' "$URL" || true)

            case "$CODE" in
              2*|3*)
                HEALTHY=true
                break
                ;;
            esac

            sleep 2
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "::error::Production health check failed."

            docker compose -p "$COMPOSE_PROJECT" logs --tail 100 || true

            if docker image inspect "$ROLLBACK_IMAGE" >/dev/null 2>&1; then
              echo "Restoring previous production image..."

              IMAGE="$ROLLBACK_IMAGE" docker compose \
                -p "$COMPOSE_PROJECT" up -d --no-build

              echo "Rollback attempted."
            else
              echo "::error::No previous production image available."
            fi

            exit 1
          fi

          echo "Production deployment successful."
          echo "Website: http://${PUBLIC_HOST}:${SITE_PORT}/"

      - name: Clean up old CI images
        if: always()
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            docker image rm -f "$IMAGE" 2>/dev/null || true
          fi
