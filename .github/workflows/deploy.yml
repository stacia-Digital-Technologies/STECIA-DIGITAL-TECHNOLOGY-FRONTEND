
name: STECIA Frontend CI and Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Prevent overlapping production deployments.
concurrency:
  group: stecia-frontend-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: [self-hosted, linux, x64, stecia-frontend]
    timeout-minutes: 25

    env:
      IMAGE: stecia-frontend:${{ github.sha }}
      LATEST_IMAGE: stecia-frontend:latest
      ROLLBACK_IMAGE: stecia-frontend:rollback
      COMPOSE_PROJECT: stecia-frontend
      SITE_PORT: ${{ vars.SITE_PORT || '5000' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$SITE_PORT" =~ ^[0-9]+$ ]] ||
             (( SITE_PORT < 1 || SITE_PORT > 65535 )); then
            echo "::error::SITE_PORT must be a valid port between 1 and 65535."
            exit 1
          fi

          echo "Deployment port: $SITE_PORT"

      - name: Check Docker availability
        run: |
          docker info
          docker compose version

      - name: Validate Docker Compose configuration
        run: |
          docker compose -p "$COMPOSE_PROJECT" config --quiet

      - name: Build Docker image
        run: |
          docker build --pull -t "$IMAGE" .

      - name: Test Docker image
        shell: bash
        run: |
          set -euo pipefail

          TEST_CONTAINER="stecia-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          cleanup() {
            docker rm -f "$TEST_CONTAINER" >/dev/null 2>&1 || true
          }

          trap cleanup EXIT

          docker run -d \
            --name "$TEST_CONTAINER" \
            "$IMAGE"

          echo "Waiting for Nginx to serve the website..."

          for attempt in $(seq 1 30); do
            if docker exec "$TEST_CONTAINER" \
              wget -qO- http://127.0.0.1:80/ \
              | grep -qi '<html'; then
              echo "Image smoke test passed."
              exit 0
            fi

            sleep 2
          done

          echo "::error::Container did not serve a valid HTML page."
          docker logs "$TEST_CONTAINER"
          exit 1

      - name: Deploy to production
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -Eeuo pipefail

          PREVIOUS_IMAGE=false

          # Preserve the currently deployed image for rollback.
          if docker image inspect "$LATEST_IMAGE" >/dev/null 2>&1; then
            docker image tag "$LATEST_IMAGE" "$ROLLBACK_IMAGE"
            PREVIOUS_IMAGE=true
            echo "Previous production image saved."
          else
            echo "No previous production image found. This may be the first deployment."
          fi

          # Promote the tested image to the Compose image tag.
          docker image tag "$IMAGE" "$LATEST_IMAGE"

          # Deploy without rebuilding.
          docker compose -p "$COMPOSE_PROJECT" up \
            -d \
            --no-build \
            --remove-orphans

          # Verify the deployed website through the host port.
          echo "Checking production website..."

          HEALTHY=false

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              "http://127.0.0.1:${SITE_PORT}/" \
              | grep -qi '<html'; then
              HEALTHY=true
              break
            fi

            sleep 2
          done

          if [[ "$HEALTHY" == true ]]; then
            echo "Production deployment successful."
            exit 0
          fi

          echo "::error::Production health check failed."

          # Restore the previous image if one exists.
          if [[ "$PREVIOUS_IMAGE" == true ]]; then
            echo "Rolling back to the previous production image..."

            docker image tag "$ROLLBACK_IMAGE" "$LATEST_IMAGE"

            docker compose -p "$COMPOSE_PROJECT" up \
              -d \
              --no-build \
              --remove-orphans

            echo "Rollback command completed."
          else
            echo "No previous image is available for rollback."
          fi

          exit 1

      - name: Deployment summary
        if: success() && github.ref == 'refs/heads/main'
        run: |
          echo "## STECIA Frontend Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Port: $SITE_PORT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
